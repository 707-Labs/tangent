<!doctype html>
<!--
  Source for the site-wide Open Graph / Twitter share card -> static/og.png (1200x630).
  Article shares get their own card, rendered on demand by src/routes/og (layout in
  src/lib/share/layout.ts); keep the two in the same brand language.
  Rendered with the real web fonts via the Chrome CLI binary (rsvg-convert would substitute
  Newsreader/Hanken and look off-brand). Regenerate after editing:

    "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" \
      --headless=new --disable-gpu --hide-scrollbars \
      --virtual-time-budget=4000 \
      --window-size=1200,630 \
      --screenshot="$PWD/static/og.png" \
      "file://$PWD/scripts/og-card.html"

  Palette + type mirror the app's "Nightstand" theme (src/app.css @theme).
-->
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500&family=Newsreader:opsz,wght@6..72,500;6..72,600&display=swap"
			rel="stylesheet"
		/>
		<style>
			* {
				margin: 0;
				padding: 0;
				box-sizing: border-box;
			}
			html,
			body {
				width: 1200px;
				height: 630px;
			}
			body {
				position: relative;
				background-color: #15110c;
				/* Lamplight wash from the top — the app's body::before, sized to the card. */
				background-image: radial-gradient(
					1200px 760px at 50% -12%,
					rgba(224, 161, 78, 0.09),
					transparent 60%
				);
				display: flex;
				flex-direction: column;
				align-items: center;
				justify-content: center;
				font-family: 'Hanken Grotesk', sans-serif;
				overflow: hidden;
			}
			/* BrandMark's lockup: the mark 1.5x the wordmark's size, gap-2 (0.5em) apart. */
			.lockup {
				display: flex;
				align-items: center;
				gap: 66px;
			}
			.mark {
				width: 164px;
				height: 198px;
			}
			.wordmark {
				font-family: 'Newsreader', serif;
				font-weight: 600;
				font-size: 132px;
				line-height: 1;
				letter-spacing: -0.025em;
				color: #ece4d6;
			}
			.tagline {
				margin-top: 40px;
				font-family: 'Newsreader', serif;
				font-weight: 500;
				font-size: 40px;
				line-height: 1.2;
				color: #cdbfa6;
			}
			.url {
				position: absolute;
				bottom: 44px;
				left: 50%;
				transform: translateX(-50%);
				font-family: 'Hanken Grotesk', sans-serif;
				font-weight: 500;
				font-size: 24px;
				letter-spacing: 0.06em;
				color: #9b8f76;
			}
			.frame {
				position: absolute;
				inset: 24px;
				border: 1px solid #342d22;
				border-radius: 22px;
				pointer-events: none;
			}
		</style>
	</head>
	<body>
		<div class="frame"></div>
		<div class="lockup">
			<!-- Brand mark (src/lib/components/BrandMark.svelte, Ben's geometry verbatim): the
			     path you were on, the ember dot at the tangent point, and the ring hanging plumb
			     below it — the moment you left the line. -->
			<svg class="mark" viewBox="0 0 24 29" fill="none" aria-hidden="true">
				<line
					x1="1.25"
					y1="1.821"
					x2="22.75"
					y2="1.821"
					stroke="#ece4d6"
					stroke-width="2.5"
					stroke-linecap="round"
				/>
				<path
					d="M13.4214 27.7455C13.4235 28.4354 12.8662 28.9976 12.1763 29.0004C11.4862 29.0027 10.9241 28.4443 10.9214 27.7543L10.9038 22.7426C11.2658 22.7813 11.6339 22.8031 12.0063 22.8031C12.4806 22.8031 12.947 22.7678 13.4038 22.7055L13.4214 27.7455ZM11.2368 3.02771C10.991 3.2568 10.8372 3.58334 10.8384 3.94568L10.8413 5.02771C7.14273 5.5995 4.3083 8.85285 4.30811 12.7797C4.30811 16.7259 7.17074 19.9903 10.896 20.5385L10.9038 22.7426C5.85966 22.2026 1.9333 18.0027 1.93311 12.8998C1.93316 7.685 6.03344 3.41425 11.2368 3.02771ZM12.9546 3.04139C18.0726 3.51146 22.0786 7.74497 22.0786 12.8998C22.0784 17.9026 18.3049 22.0363 13.4038 22.7055L13.396 20.4906C16.9838 19.824 19.7036 16.6265 19.7036 12.7797C19.7034 8.91383 16.9565 5.70336 13.3423 5.05896L13.3384 3.93787C13.3371 3.5857 13.1897 3.26788 12.9546 3.04139ZM12.0845 2.69178C12.4222 2.69085 12.729 2.82412 12.9546 3.04139C12.6425 3.01272 12.3261 2.99648 12.0063 2.99646C11.7476 2.99647 11.4907 3.00886 11.2368 3.02771C11.4591 2.8207 11.7569 2.69299 12.0845 2.69178Z"
					fill="#ece4d6"
				/>
				<ellipse cx="12.0061" cy="2.1118" rx="2.148" ry="2.1118" fill="#e0a14e" />
			</svg>
			<span class="wordmark">tangent</span>
		</div>
		<p class="tagline">Fall down a Wikipedia rabbit hole.</p>
		<span class="url">tangent.page</span>
	</body>
</html>
