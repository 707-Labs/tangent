<!doctype html>
<html lang="en" data-theme="nightstand">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="theme-color" content="#15110c" />
		<!--
			No-flash theme: resolve the saved preference (or the OS color-scheme for 'system')
			and set data-theme + the chrome tint BEFORE first paint, so a light-theme reload
			never flashes the dark default. The store (theme.svelte.ts) takes over after hydration.
			The migration and bg map mirror themes.ts so saved choices match hydration.
		-->
		<script>
			(function () {
				try {
					var pref = localStorage.getItem('tangent:theme:v1') || 'system';
					var retired = { sepia: 'daylight', newsprint: 'daylight', slate: 'nightstand', forest: 'nightstand', wine: 'nightstand' };
					if (Object.prototype.hasOwnProperty.call(retired, pref)) pref = retired[pref];
					if (pref !== 'system' && pref !== 'nightstand' && pref !== 'daylight' && pref !== 'high-contrast') pref = 'system';
					// Hydration uses the same migration; do it before paint too.
					if (pref === 'system') {
						pref = matchMedia('(prefers-color-scheme: dark)').matches ? 'nightstand' : 'daylight';
					}
					document.documentElement.dataset.theme = pref;
					// Chrome tint mirrors THEMES[].bg.
					var bg = {
						nightstand: '#15110c',
						daylight: '#f5efe3',
						'high-contrast': '#000000'
					};
					var m = bg[pref] && document.querySelector('meta[name="theme-color"]');
					if (m) m.setAttribute('content', bg[pref]);
				} catch (e) {}
			})();
		</script>
		<!-- Fonts are self-hosted via Fontsource (imported in +layout.svelte) — no request to
		     Google, so no visitor IP is sent to a third party on load. -->
		<meta
			name="description"
			content="Tangent. Fall down a Wikipedia rabbit hole. A feed of connected articles that shows how unrelated topics link together."
		/>
		<!-- Social share card. src/hooks.server.ts fills the share placeholders below per
		     request (src/lib/share/meta.ts): an article link gets its own title and a card
		     generated by /og; every other page gets the site card (static/og.png, from
		     scripts/og-card.html). og:image must be absolute — scrapers don't resolve
		     relative paths or %sveltekit.assets%. -->
		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="Tangent" />
		<meta property="og:url" content="%tangent.share.url%" />
		<meta property="og:title" content="%tangent.share.title%" />
		<meta property="og:description" content="%tangent.share.description%" />
		<meta property="og:image" content="%tangent.share.image%" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta property="og:image:alt" content="%tangent.share.image_alt%" />
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:title" content="%tangent.share.title%" />
		<meta name="twitter:description" content="%tangent.share.description%" />
		<meta name="twitter:image" content="%tangent.share.image%" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover" class="bg-void text-ink antialiased">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
